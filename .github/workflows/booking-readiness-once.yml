name: One-time booking provider readiness check
on:
  pull_request:
    branches: [main]
  push:
    branches: [booking-hostaway-beach-baby-casa-direct-20261028]
    paths: [.github/workflows/booking-readiness-once.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check provider URLs and public property configuration
        run: node tools/booking_diagnostics.mjs
