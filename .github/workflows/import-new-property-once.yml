name: Import Pacific Stay Airbnb listing public gallery
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - import-airbnb-1798660872755121079-20261028
    paths:
      - .github/workflows/import-new-property-once.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public-listing importer requirements
        run: |
          python -m pip install --disable-pip-version-check playwright pillow requests
          python -m playwright install --with-deps chromium
          python -m py_compile tools/import_new_airbnb_listing.py
      - name: Collect publicly visible listing details and photos
        id: import
        continue-on-error: true
        run: python tools/import_new_airbnb_listing.py
      - name: Commit captured listing research and complete gallery
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/imports/new-listing-1798660872755121079-*.json public/new-listing-1798660872755121079 || true
          if ! git diff --cached --quiet; then
            git commit -m "Import new listing's current public Airbnb photos and facts"
            git push origin HEAD:import-airbnb-1798660872755121079-20261028
          fi
      - name: Fail job if public gallery import incomplete
        if: steps.import.outcome == 'failure'
        run: exit 1
