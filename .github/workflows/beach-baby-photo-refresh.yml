name: One-time Beach Baby photo refresh
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - photo-refresh-beach-baby-20261028
    paths:
      - ".github/workflows/beach-baby-photo-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install photo extraction dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright pillow requests
          python -m playwright install --with-deps chromium
      - name: Extract current Airbnb photos, stopping safely on partial gallery
        run: python tools/refresh_beach_baby_photos.py
      - name: Commit verified gallery to refresh branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/beach-baby docs/imports/beach-baby-photos.json
          if git diff --cached --quiet; then
            echo "No photo changes found."
          else
            git commit -m "Refresh Beach Baby gallery from current Airbnb listing"
            git push
          fi
